[package]
name         = "sema"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "Sema version 0: Markdown read into a typed document tree and printed back."
publish      = false

[[bin]]
name              = "sema"
path              = "cli/main.rs"
required-features = ["datom"]

[features]
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
comrak      = { version = "0.59", default-features = false }
rkyv        = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "5cd6219", optional = true }
protos      = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
