[workspace]
members = [".", "cli"]
exclude = ["measure"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
publish      = false

[package]
name                       = "sema"
description                = "Sema version 0: Markdown read into a typed document tree and printed back."
version.workspace          = true
edition.workspace          = true
rust-version.workspace     = true
license.workspace          = true
publish.workspace          = true

[features]
datom = ["dep:datom-codec"]

[dependencies]
comrak      = { version = "0.59", default-features = false }
rkyv        = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
# serde with derive: the build base builds serde 1.0.229 with derive for every
# repository, attaching serde_derive, so this workspace carries that edge.
serde       = { version = "1.0.229", features = ["derive"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "5cd6219", optional = true }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "daa22ee" }
